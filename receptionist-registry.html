<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCoS: Reception Registry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* UI Elements - Non-Printing */
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a237e; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1a237e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* Log Table */
        .log-table { width: 100%; max-width: 500px; margin-top: 30px; border-collapse: collapse; background: white; }
        .log-table th, .log-table td { padding: 12px; border: 1px solid #eee; text-align: left; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: #e8f5e9; color: #2e7d32; }

        /* THE CARD: On-Screen & Printing Rules */
        #printablePass {
            display: none; /* Hidden until card is linked */
            position: relative;
            background: white;
            width: 2.5in;
            height: 3.5in;
            border: 1px solid #333;
            padding: 0.1in;
            text-align: center;
            box-sizing: border-box;
            line-height: 1.1;
            margin-top: 20px;
            overflow: hidden;
        }

        @media print {
            body * { visibility: hidden; }
            #printablePass, #printablePass * { visibility: visible; }
            #printablePass { 
                position: absolute; 
                left: 0; top: 0; 
                margin: 0;
                border: 1px solid #000;
            }
            #actualPrintBtn { display: none; }
        }

        /* Card Elements Scaling */
        #printLogo { max-width: 45px; max-height: 45px; margin-bottom: 2px; }
        #printGuestName { font-size: 14px; margin: 2px 0; font-weight: bold; color: #000; }
        #printDetails { font-size: 11px; margin: 2px 0; color: #333; }
        /* Forces the QR code to be centered and on its own line */
        #printQR canvas, #printQR img {
            display: block;
            margin: 0 auto !important;
        }

        #printQR {
            display: block;
            width: 100%;
            text-align: center;
            margin: 5px 0;
        }
        
        .footer-text {
            position: absolute;
            bottom: 0.1in;
            left: 0;
            right: 0;
            font-size: 7px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>🛡️ Reception Registry</h2>
        <p>Assign Physical Card to Guest</p>
        <input type="text" id="cardID" placeholder="Card Number (e.g., 001)">
        <input type="text" id="guestName" placeholder="Guest Full Name">
        <input type="text" id="visitPurpose" placeholder="Purpose / Office No.">
        <button onclick="assignCard()">LINK & ACTIVATE CARD</button>
    </div>

    <div id="printablePass">
        <div style="border-bottom: 1px solid #333; padding-bottom: 3px; margin-bottom: 5px;">
            <img src="logo.jpg" alt="NCoS" id="printLogo">
            <h3 style="margin:0; color:#1a237e; font-size: 11px;">NIGERIA CORRECTIONAL SERVICE</h3>
            <p style="font-size: 8px; margin: 0; font-weight: bold;">NHQ, ABUJA</p>
        </div>
        
        <p style="font-size: 9px; font-weight: bold; margin: 2px 0; letter-spacing: 1px;">VISITOR PASS</p>
        
        <div id="printQR"></div>
        
        <p style="font-size: 8px; color: #666; margin: 0;">VALID TODAY ONLY</p>

        <div style="margin-top: 8px;">
            <p style="font-size: 7px; text-transform: uppercase; margin-bottom: 1px; color: #777;">Guest Name:</p>
            <P><div id="printGuestName"></div></P>
            <div id="printDetails"></div>
        </div>
        
        <div class="footer-text">
            Property of NCoS SI&I NHQ.<br>Must be returned to Security.
        </div>

        <button onclick="window.print()" id="actualPrintBtn" style="background:#4caf50; color:white; border:none; border-radius:4px; padding:5px; cursor:pointer; font-size: 10px; margin-top: 5px;">Print Pass</button>
    </div>

    <table class="log-table" id="logTable">
        <thead>
            <tr><th>Card</th><th>Guest</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="logBody"></tbody>
    </table>

    <script>
        function assignCard() {
            const id = document.getElementById('cardID').value;
            const name = document.getElementById('guestName').value;
            const purpose = document.getElementById('visitPurpose').value;

            if(!id || !name) return alert("Fill Name and Card ID");

            let registry = JSON.parse(localStorage.getItem('vgn_registry') || '{}');
            registry[id] = { name, purpose, time: new Date().toLocaleTimeString(), status: 'ACTIVE' };
            localStorage.setItem('vgn_registry', JSON.stringify(registry));

            // Populate the Card
            document.getElementById('printablePass').style.display = 'block';
            document.getElementById('printGuestName').innerText = name.toUpperCase();
            document.getElementById('printDetails').innerText = `DESTINATION: ${purpose}`;
            
            // Clear and generate the QR
            const printQRContainer = document.getElementById('printQR');
            printQRContainer.innerHTML = "";
            new QRCode(printQRContainer, { 
                text: id, 
                width: 90, // Adjusted for 2.5in width
                height: 90,
                colorDark : "#000000",
                colorLight : "#ffffff"
            });

            updateTable();
            
            // Clear inputs
            document.getElementById('cardID').value = "";
            document.getElementById('guestName').value = "";
            document.getElementById('visitPurpose').value = "";
        }

        function updateTable() {
            const registry = JSON.parse(localStorage.getItem('vgn_registry') || '{}');
            const tbody = document.getElementById('logBody');
            tbody.innerHTML = "";
            for (let id in registry) {
                tbody.innerHTML += `<tr>
                    <td><b>${id}</b></td>
                    <td>${registry[id].name}</td>
                    <td><span class="status-badge">${registry[id].status}</span></td>
                    <td><button onclick="clearCard('${id}')" style="background:red; color:white; border:none; padding:5px; font-size:10px; cursor:pointer; border-radius:4px;">End</button></td>
                </tr>`;
            }
        }

        function clearCard(id) {
            let registry = JSON.parse(localStorage.getItem('vgn_registry') || '{}');
            delete registry[id];
            localStorage.setItem('vgn_registry', JSON.stringify(registry));
            updateTable();
            document.getElementById('printablePass').style.display = 'none';
        }

        window.onload = updateTable;
    </script>
</body>
</html>
