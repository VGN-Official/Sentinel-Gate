<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGN Sentinel - Unified Registry</title>
    <!-- FontAwesome for professional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --vgn-blue: #1a237e;
            --vgn-green: #2e7d32;
            --vgn-gold: #c5a059;
            --card-bg: #eae0ce; /* Matches the beige/gold color in your photo */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--vgn-blue);
            margin: 5px 0;
        }

        /* Form styling */
        .registry-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .form-group.full-width { grid-column: span 1; }
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #555;
        }

        input, select {
            padding: 10px;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--vgn-blue);
        }

        .btn-generate {
            background: var(--vgn-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-generate:hover {
            background: #0d165c;
        }

        /* Output Preview Section */
        .preview-title {
            text-align: center;
            margin-top: 20px;
            font-size: 1.3rem;
            color: #444;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-top: 25px;
        }

        /* CARD 1: PVC Pass Card (NIS Photo Style - Rotated Portrait Text) */
        .pvc-card {
            width: 324px;   /* Standard CR80 scale aspect ratio (approx 3.375" width) */
            height: 504px;  /* (approx 5.25" height in relative pixels to hold design) */
            background: var(--card-bg);
            border: 1px solid #c0b39b;
            border-radius: 18px; /* Slightly thicker rounded corners like laminated PVC */
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Rotated Text Panel like the physical NIS Gate Pass */
        .pvc-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-grow: 1;
        }

        .pvc-logo {
            width: 65px;
            height: auto;
            margin-bottom: 15px;
        }

        /* Rotates text layout vertically matching the provided reference image */
        .pvc-vertical-text {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            font-family: 'Arial Black', Impact, sans-serif;
            color: #1e2838;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(180deg); /* Orients starting from bottom to top */
            margin-top: 10px;
        }

        .pvc-agency {
            font-size: 1.15rem;
            font-weight: 900;
            margin-left: 8px;
        }

        .pvc-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: #2b3a51;
            margin-left: 8px;
        }

        .pvc-pass-number {
            font-size: 1.8rem;
            font-weight: 900;
            color: #111;
            margin-top: 15px;
        }

        /* CARD 2: Landscape Sticker Layout (Standard Windshield Decal) */
        .sticker-card {
            width: 480px;
            height: 300px;
            background: white;
            border: 4px solid var(--vgn-green);
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            box-sizing: border-box;
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sticker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--vgn-green);
            padding-bottom: 8px;
        }

        .sticker-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--vgn-green);
            text-transform: uppercase;
        }

        .sticker-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            height: 100%;
        }

        .sticker-details {
            flex-grow: 1;
            font-size: 1rem;
            line-height: 1.5;
        }

        .sticker-details table {
            width: 100%;
            border-collapse: collapse;
        }

        .sticker-details td {
            padding: 5px 0;
            font-weight: bold;
        }

        .sticker-details .label {
            color: #666;
            font-weight: normal;
            font-size: 0.85rem;
        }

        .qr-wrapper {
            background: white;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
        }

        .qr-placeholder {
            width: 100px;
            height: 100px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            text-align: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #777;
            border: 1px dashed #999;
        }

        .sticker-footer {
            background: var(--vgn-green);
            color: white;
            text-align: center;
            padding: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* Print styling logic */
        @media print {
            body * {
                visibility: hidden;
            }
            .output-area, .output-area * {
                visibility: visible;
            }
            .output-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="no-print">
        <h1>🛡️ VGN Sentinel Gate</h1>
        <p>Unified Registry System & Print Engine</p>
    </header>

    <!-- Interactive Registry Panel -->
    <div class="registry-panel no-print">
        <h3 style="margin-top:0; color: var(--vgn-blue); border-bottom: 2px solid #eee; padding-bottom:10px;">
            <i class="fa-solid fa-address-card"></i> Issue New Credential
        </h3>
        
        <form id="cardForm" onsubmit="generateCard(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="cardType">Format Target</label>
                    <select id="cardType" onchange="toggleFormInputs()">
                        <option value="pvc">PVC Gate Pass Card (Vertical Style)</option>
                        <option value="sticker">Windshield Security Sticker</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="passNumber">Pass / Serial ID No.</label>
                    <input type="text" id="passNumber" value="SHQ - 4426" required>
                </div>

                <div class="form-group full-width">
                    <label for="agencyName">Agency / Organisation Name</label>
                    <input type="text" id="agencyName" value="NIGERIA IMMIGRATION SERVICE" required>
                </div>

                <div class="form-group" id="holderGroup">
                    <label for="holderName">Holder / Owner Name</label>
                    <input type="text" id="holderName" value="Ibrahim Babangida">
                </div>

                <div class="form-group" id="vehicleGroup">
                    <label for="vehicleDetails">Vehicle Number / Info</label>
                    <input type="text" id="vehicleDetails" value="Toyota Hilux [ABJ-904-CS]">
                </div>
            </div>

            <button type="submit" class="btn-generate">
                <i class="fa-solid fa-print"></i> Generate & Print Preview
            </button>
        </form>
    </div>

    <!-- Output Rendering Area -->
    <h3 class="preview-title no-print">Generated Output (Print Ready)</h3>
    
    <div class="output-area">
        <!-- RENDER CONTAINER -->
        <div id="renderTarget">
            <!-- Dynamic layout injection point -->
        </div>
        
        <button class="btn-generate no-print" style="width:200px; background:var(--vgn-green);" onclick="window.print()">
            <i class="fa-solid fa-print"></i> Print Document
        </button>
    </div>
</div>

<script>
    function toggleFormInputs() {
        const type = document.getElementById('cardType').value;
        const holderGroup = document.getElementById('holderGroup');
        const vehicleGroup = document.getElementById('vehicleGroup');
        
        if (type === 'pvc') {
            holderGroup.style.display = 'flex';
            vehicleGroup.style.display = 'none';
        } else {
            holderGroup.style.display = 'flex';
            vehicleGroup.style.display = 'flex';
        }
    }

    function generateCard(event) {
        event.preventDefault();
        
        const type = document.getElementById('cardType').value;
        const passNo = document.getElementById('passNumber').value;
        const agency = document.getElementById('agencyName').value;
        const holder = document.getElementById('holderName').value;
        const vehicle = document.getElementById('vehicleDetails').value;
        
        const renderTarget = document.getElementById('renderTarget');
        
        // QR Code Raw Payload string (your scanner parses this JSON!)
        const scanPayload = JSON.stringify({
            app: "VGN-Sentinel",
            type: type,
            id: passNo,
            owner: holder,
            v: type === 'sticker' ? vehicle : 'N/A'
        });

        if (type === 'pvc') {
            // Generates vertical card layout matching your photo setup
            renderTarget.innerHTML = `
                <div class="pvc-card">
                    <!-- Standard Coat of Arms Logo Placeholder -->
                    <img class="pvc-logo" src="https://upload.wikimedia.org/wikipedia/commons/b/bc/Coat_of_arms_of_Nigeria.svg" alt="Coat of Arms">
                    
                    <div class="pvc-body">
                        <div class="pvc-vertical-text">
                            <span class="pvc-agency">${agency}</span>
                            <span class="pvc-title">VEHICLE GATE PASS</span>
                        </div>
                        <div class="pvc-pass-number">${passNo}</div>
                    </div>

                    <!-- Hidden QR code container for Guard Scanner compatibility -->
                    <div class="qr-wrapper" style="margin-top:10px;">
                        <div class="qr-placeholder">QR: ${passNo}</div>
                    </div>
                </div>
            `;
        } else {
            // Generates landscape vehicle sticker
            renderTarget.innerHTML = `
                <div class="sticker-card">
                    <div class="sticker-header">
                        <span class="sticker-title">VGN VEHICLE ACCESS</span>
                        <i class="fa-solid fa-shield-halved" style="color: var(--vgn-green); font-size:1.5rem;"></i>
                    </div>
                    
                    <div class="sticker-body">
                        <div class="sticker-details">
                            <table>
                                <tr>
                                    <td class="label">SERIAL PASS NO.</td>
                                </tr>
                                <tr>
                                    <td style="font-size: 1.2rem; color: #111;">${passNo}</td>
                                </tr>
                                <tr>
                                    <td class="label">REGISTERED OWNER</td>
                                </tr>
                                <tr>
                                    <td style="font-size: 0.95rem;">${holder}</td>
                                </tr>
                                <tr>
                                    <td class="label">VEHICLE CLASS</td>
                                </tr>
                                <tr>
                                    <td style="font-size: 0.9rem; color:#444;">${vehicle}</td>
                                </tr>
                            </table>
                        </div>

                        <div class="qr-wrapper">
                            <div class="qr-placeholder">QR: ${passNo}</div>
                        </div>
                    </div>

                    <div class="sticker-footer">
                        SECURE PARKING PROTOCOL REGISTERED
                    </div>
                </div>
            `;
        }
        
        // Save dynamically to LocalStorage so marshal-scanner.html can fetch it
        saveToLocalRegistry(passNo, {
            type: type,
            agency: agency,
            holder: holder,
            vehicle: vehicle,
            timestamp: new Date().toISOString()
        });
    }

    function saveToLocalRegistry(id, data) {
        let registry = JSON.parse(localStorage.getItem('vgn_registry')) || {};
        registry[id] = data;
        localStorage.setItem('vgn_registry', JSON.stringify(registry));
        console.log("Card Registered Locally:", data);
    }

    // Initialize layout on load
    window.onload = function() {
        toggleFormInputs();
        // Fire initial mock generator
        document.getElementById('cardForm').dispatchEvent(new Event('submit'));
    };
</script>

</body>
</html>
