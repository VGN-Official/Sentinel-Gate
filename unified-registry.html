<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCoS: Unified Registry Terminal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* UI Elements - Non-Printing Workspace */
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; box-sizing: border-box; }
        h2 { color: #1a237e; margin-top: 0; text-align: center; }
        label { font-weight: bold; font-size: 0.85rem; color: #444; }
        input, select { width: 100%; padding: 12px; margin: 6px 0 16px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        button { width: 100%; padding: 15px; background: #1a237e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0d165c; }
        
        /* Log Table Grid */
        .log-table { width: 100%; max-width: 600px; margin-top: 30px; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .log-table th, .log-table td { padding: 12px; border: 1px solid #eee; text-align: left; font-size: 0.9rem; }
        .log-table th { background: #f9f9f9; color: #555; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; background: #e8f5e9; color: #2e7d32; font-weight: bold; }

        /* Security Gate Gatekeepers */
        #vgn-lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a237e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; color: white; }
        .lock-box { background: white; padding: 30px; border-radius: 15px; color: #333; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; }
        .lock-box input { font-size: 24px; text-align: center; letter-spacing: 5px; margin-bottom: 20px; border: 2px solid #1a237e; }
        .hidden-content { filter: blur(25px); pointer-events: none; user-select: none; }

        /* PRINT INTERACTION LAYOUT WRAPPERS */
        .print-preview-container { display: none; margin-top: 25px; text-align: center; }
        
        /* FORMAT 1: Standard Guest Pass (Vertical Layout) */
        .layout-guest {
            position: relative; background: white;
            width: 2.5in; height: 3.5in; border: 1px solid #000;
            padding: 0.1in; text-align: center; box-sizing: border-box;
            line-height: 1.1; overflow: hidden; margin: 0 auto 15px auto;
        }

        /* FORMAT 2: Car Tag Layout (Landscape Professional PVC Scale) */
        .layout-cartag {
            position: relative; background: #fff;
            width: 3.375in; height: 2.125in; border: 2.5px solid #2e7d32;
            border-radius: 10px; padding: 10px; text-align: left; box-sizing: border-box;
            overflow: hidden; margin: 0 auto 15px auto; display: flex; flex-direction: column; justify-content: space-between;
        }
        .cartag-header { display: flex; align-items: center; border-bottom: 1.5px solid #2e7d32; padding-bottom: 4px; }
        .cartag-header-text { margin-left: 8px; }
        .cartag-header-text h4 { margin: 0; color: #2e7d32; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; }
        .cartag-header-text p { margin: 0; font-size: 7px; font-weight: bold; color: #333; }
        .cartag-body { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; height: 100%; }
        .cartag-data { font-size: 9px; line-height: 1.3; font-weight: bold; color: #111; }
        .cartag-data span { color: #666; font-size: 7px; font-weight: normal; display: block; text-transform: uppercase; }
        .cartag-id-badge { font-size: 15px; color: #b71c1c; font-weight: 900; margin-top: 2px; }

        /* FORMAT 3: Windscreen Sticker Layout (Landscape Border Optimized) */
        .layout-sticker {
            position: relative; background: white;
            width: 3.5in; height: 2.5in; border: 3px dashed #1a237e;
            border-radius: 8px; padding: 12px; text-align: center; box-sizing: border-box;
            margin: 0 auto 15px auto; display: flex; flex-direction: column; justify-content: space-between;
        }
        .sticker-title { font-size: 11px; font-weight: 900; color: #1a237e; border-bottom: 1px dashed #1a237e; padding-bottom: 4px; text-transform: uppercase; }
        .sticker-body { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 8px; }
        .sticker-meta { text-align: left; font-size: 9px; font-weight: bold; color: #222; }

        /* Universal Image Scaling */
        .ncos-logo { max-width: 40px; max-height: 40px; object-fit: contain; }
        .qr-render-box { display: block; margin: 0 auto; }
        .qr-render-box canvas, .qr-render-box img { display: block; margin: 0 auto !important; }

        .footer-text { position: absolute; bottom: 4px; left: 0; right: 0; font-size: 6.5px; color: #666; border-top: 1px solid #eee; padding-top: 2px; text-transform: uppercase; text-align: center; font-weight: bold; }

        /* GLOBAL HARDWARE PRINT COMMAND TRIPPERS */
        @media print {
            body * { visibility: hidden; }
            #activePrintArea, #activePrintArea * { visibility: visible; }
            #activePrintArea { position: absolute; left: 0; top: 0; margin: 0; border: none; box-shadow: none; }
            #actualPrintBtn { display: none; }
        }
    </style>
</head>
<body>

    <!-- Security Gate Pass Overlay -->
    <div id="vgn-lock-screen">
        <div class="lock-box">
            <img src="logo.jpg" class="ncos-logo" style="max-width:70px; max-height:70px; margin-bottom: 10px;">
            <h2 style="margin-bottom: 5px; font-size: 1.3rem;">VGN ACCESS CONTROL</h2>
            <p style="font-size: 11px; color: #666; margin-bottom: 20px; font-weight: bold;">SECURITY, INTELLIGENCE & INVESTIGATION UNIT</p>
            <input type="password" id="vgn-pin" placeholder="****" maxlength="4">
            <button onclick="unlockRegistry()">AUTHORIZE ACCESS</button>
            <p id="lock-msg" style="color: red; font-size: 12px; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Main Active Workspace Content Area -->
    <div id="main-content" class="hidden-content">
        <div class="box">
            <h2>🛡️ NCoS Unified Registry</h2>
            
            <label for="moduleSelector">Target Module Profile</label>
            <select id="moduleSelector" onchange="switchModuleView()">
                <option value="guest">Physical Card to Guest (Vertical)</option>
                <option value="cartag">Car Tag with NCoS Logo (Landscape PVC)</option>
                <option value="sticker">Windscreen Access Sticker (Dense QR Data)</option>
            </select>

            <div id="dynamicInputs">
                <!-- Inputs managed dynamically via switch logic below -->
            </div>
            
            <button onclick="processRegistration()">LINK & ACTIVATE ASSET</button>
        </div>

        <!-- Unified Print Preview Interface Rendering Node -->
        <div class="print-preview-container" id="printablePass">
            <div id="activePrintArea">
                <!-- Injected Target Content Layout Structure Spits Here -->
            </div>
            <button onclick="window.print()" id="actualPrintBtn" style="background:#2e7d32; color:white; width: 180px; margin-top: 10px;">Print Pass Asset</button>
        </div>

        <!-- Local Storage Asset Registration Matrix Output Log Table -->
        <table class="log-table" id="logTable">
            <thead>
                <tr><th>Asset ID</th><th>Holder / Purpose</th><th>Module Style</th><th>Action</th></tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>

    <script>
        const MASTER_PIN = "2026"; 

        function unlockRegistry() {
            const pin = document.getElementById('vgn-pin').value;
            const msg = document.getElementById('lock-msg');
            if (pin === MASTER_PIN) {
                document.getElementById('vgn-lock-screen').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden-content');
                sessionStorage.setItem('vgn_auth', 'true');
            } else {
                msg.innerText = "ACCESS DENIED: INVALID CREDENTIALS";
                document.getElementById('vgn-pin').value = "";
            }
        }

        // Swaps matching forms dynamically based on selected module index
        function switchModuleView() {
            const moduleType = document.getElementById('moduleSelector').value;
            const container = document.getElementById('dynamicInputs');
            
            if(moduleType === 'guest') {
                container.innerHTML = `
                    <input type="text" id="cardID" placeholder="Card Number (e.g., 001)">
                    <input type="text" id="guestName" placeholder="Guest Full Name">
                    <input type="text" id="visitPurpose" placeholder="Purpose / Office No.">`;
            } else if (moduleType === 'cartag') {
                container.innerHTML = `
                    <input type="text" id="cardID" placeholder="Pass / Serial Number (e.g., SHQ-4426)">
                    <input type="text" id="guestName" placeholder="Officer / Assignee Name">
                    <input type="text" id="vehicleModel" placeholder="Vehicle Model (e.g., Toyota Camry)">
                    <input type="text" id="plateNumber" placeholder="Plate Number (e.g., ABJ-123-XY)">`;
            } else if (moduleType === 'sticker') {
                container.innerHTML = `
                    <input type="text" id="cardID" placeholder="Sticker Serial ID">
                    <input type="text" id="guestName" placeholder="Driver / Fleet Identity">
                    <input type="text" id="vehicleModel" placeholder="Vehicle Model / Brand">
                    <input type="text" id="plateNumber" placeholder="Plate Registration Number">`;
            }
        }

        function processRegistration() {
            const moduleType = document.getElementById('moduleSelector').value;
            const id = document.getElementById('cardID').value;
            const name = document.getElementById('guestName').value;
            
            if(!id || !name) return alert("Please fill in Card/Asset ID and Name fields.");

            let registry = JSON.parse(localStorage.getItem('vgn_registry') || '{}');
            let metaData = { 
                name: name.toUpperCase(), 
                module: moduleType,
                time: new Date().toLocaleTimeString(),
                date: new Date().toLocaleDateString()
            };

            // Capture structural module variations
            if (moduleType !== 'guest') {
                metaData.vehicle = document.getElementById('vehicleModel').value.toUpperCase();
                metaData.plate = document.getElementById('plateNumber').value.toUpperCase();
            } else {
                metaData.purpose = document.getElementById('visitPurpose').value.toUpperCase();
            }

            registry[id] = metaData;
            localStorage.setItem('vgn_registry', JSON.stringify(registry));

            // Render Print Assets
            renderPrintAsset(id, metaData);
            updateTable();
            switchModuleView(); // Flush input fields cleanly
        }

        function renderPrintAsset(id, data) {
            const target = document.getElementById('activePrintArea');
            const containerBox = document.getElementById('printablePass');
            containerBox.style.display = 'block';
            target.innerHTML = ""; // Flush previous structural layout nodes

            if(data.module === 'guest') {
                target.innerHTML = `
                    <div class="layout-guest">
                        <div style="border-bottom: 1px solid #333; padding-bottom: 3px; margin-bottom: 5px;">
                            <img src="logo.jpg" alt="NCoS" class="ncos-logo">
                            <h3 style="margin:0; color:#1a237e; font-size: 11px; font-weight:900;">NIGERIA CORRECTIONAL SERVICE</h3>
                            <p style="font-size: 8px; margin: 0; font-weight: bold;">NHQ, ABUJA</p>
                        </div>
                        <p style="font-size: 9px; font-weight: bold; margin: 2px 0; letter-spacing: 1px;">VISITOR PASS</p>
                        <div id="qrNode" class="qr-render-box"></div>
                        <p style="font-size: 8px; color: #666; margin: 2px 0;">VALID TODAY ONLY</p>
                        <div style="margin-top: 6px;">
                            <p style="font-size: 7px; text-transform: uppercase; margin-bottom: 1px; color: #777;">Guest Name:</p>
                            <div style="font-size: 13px; font-weight: bold; color: #000;">${data.name}</div>
                            <div style="font-size: 10px; margin-top: 2px; color: #333; font-weight:bold;">DESTINATION: ${data.purpose}</div>
                        </div>
                        <div class="footer-text">Property of NCoS SI&I NHQ.<br>Must be returned to Security.</div>
                    </div>`;
                
                // Classic standard configuration scanner pairing mapping pass ID only
                new QRCode(document.getElementById('qrNode'), { text: id, width: 85, height: 85 });

            } else if (data.module === 'cartag') {
                target.innerHTML = `
                    <div class="layout-cartag">
                        <div class="cartag-header">
                            <img src="logo.jpg" alt="NCoS" class="ncos-logo" style="max-width:40px; max-height:40px;">
                            <div class="cartag-header-text">
                                <h4>NIGERIA CORRECTIONAL SERVICE</h4>
                                <p>OFFICIAL VEHICLE GATE ACCESS PASS</p>
                            </div>
                        </div>
                        <div class="cartag-body">
                            <div class="cartag-data">
                                <span>ASSIGNED TO / HOLDER</span>
                                <div style="font-size:15px; margin-bottom:4px;">${data.name}</div>
                                <span>VEHICLE IDENTIFICATION</span>
                                <div style="font-size:15.5px; color:#333;">${data.vehicle}</div>
                                <div style="font-size:15.5px; margin-top:1px; letter-spacing:0.5px;">${data.plate}</div>
                            </div>
                            <div style="text-align:center;">
                                <div id="qrNode" class="qr-render-box"></div>
                                <div class="cartag-id-badge">${id}</div>
                            </div>
                        </div>
                        <div class="footer-text" style="font-size:8.5px; bottom:2px;">SECURITY ENFORCED • SI&I NHQ ABUJA • NON-TRANSFERABLE</div>
                    </div>`;
                
                new QRCode(document.getElementById('qrNode'), { text: id, width: 70, height: 70 });

            } else if (data.module === 'sticker') {
                target.innerHTML = `
                    <div class="layout-sticker">
                        <div class="sticker-title">NCoS(SI&I) Windscreen Sticker</div>
                        <div class="sticker-body">
                            <div id="qrNode" class="qr-render-box"></div>
                            <div class="sticker-meta">
                                <div style="color:#b71c1c; font-size:12px; margin-bottom:4px;">ID: ${id}</div>
                                <div style="text-transform:uppercase; font-size:9px;">${data.name}</div>
                                <div style="color:#555; font-size:8px; margin-top:2px;">REG: ${data.plate}</div>
                                <div style="color:#777; font-size:7px; font-weight:normal; margin-top:3px;">Issued: ${data.date}</div>
                            </div>
                        </div>
                        <div style="font-size:7px; font-weight:bold; color:#1a237e; text-align:center; text-transform:uppercase; margin-top:4px;">
                            SCAN CRYPTOGRAPHIC EMBEDDED STRING FOR VERIFICATION
                        </div>
                    </div>`;
                
                // Deep Structured Cryptographic Serialization String Mapping for Sticker Module
                const tightPayload = `NCoS|S|${id}|${data.name}|${data.plate}`;new QRCode(document.getElementById('qrNode'), { 
                text: tightPayload, 
                width: 95, 
                height: 95,
                correctLevel: QRCode.CorrectLevel.M
                });
            }
        }

       function updateTable() {
    const registry = JSON.parse(localStorage.getItem('vgn_registry') || '{}');
    const tbody = document.getElementById('logBody');
    if(!tbody) return; 
    tbody.innerHTML = "";
    
    for (let id in registry) {
        let currentProfile = registry[id];
        
        // 1. SAFEGUARD: Fallback if module, name, or properties are missing
        let cardModule = currentProfile.module || 'guest'; 
        let cardName = currentProfile.name || currentProfile.holder || 'UNKNOWN';
        let cardVehicle = currentProfile.vehicle || 'N/A';
        let cardPlate = currentProfile.plate || 'N/A';
        let cardPurpose = currentProfile.purpose || currentProfile.vehicle || 'N/A';

        // 2. Adjust metadata display safely
        let displayMeta = cardModule === 'guest' ? cardPurpose : `${cardVehicle} [${cardPlate}]`;
        
        tbody.innerHTML += `<tr>
            <td><b>${id}</b></td>
            <td><div style="font-weight:bold;">${cardName}</div><span style="font-size:11px; color:#666;">${displayMeta}</span></td>
            <td><span class="status-badge" style="background:${cardModule==='guest'?'#e8f5e9':cardModule==='cartag'?'#e3f2fd':'#fff3e0'}; color:${cardModule==='guest'?'#2e7d32':cardModule==='cartag'?'#1565c0':'#e65100'};">${cardModule.toUpperCase()}</span></td>
            <td><button onclick="clearCard('${id}')" style="background:#d32f2f; color:white; border:none; padding:6px 10px; font-size:11px; cursor:pointer; border-radius:4px; width:auto;">Revoke</button></td>
        </tr>`;
    }
}

        function clearCard(id) {
            let registry = JSON.parse(localStorage.getItem('vgn_registry') || '{}');
            delete registry[id];
            localStorage.setItem('vgn_registry', JSON.stringify(registry));
            updateTable();
            document.getElementById('printablePass').style.display = 'none';
        }

        window.onload = function() {
            switchModuleView();
            updateTable();
            if (sessionStorage.getItem('vgn_auth') === 'true') {
                document.getElementById('vgn-lock-screen').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden-content');
            }
        };
    </script>
</body>
</html>
